[tox]
envlist = py3{9,10,11,12}
skip_missing_interpreters = true
isolated_build = True

[testenv]
allowlist_externals = env
extras =
    dev
commands =
    env
    pytest -lvv --cov-report xml --cov-report html --junit-xml report.xml {posargs}

[testenv:publish]
changedir =
passenv =
    TWINE_*
skip_install=true
deps =
    setuptools_scm
    build
    twine
install_command =
    python -m pip install {opts} {packages}
commands =
    python -m setuptools_scm
    python -m build
    python -m twine check dist/*
    python -m twine upload dist/*
commands_post=
