[metadata]
name = gdcdictionary
description = The Genomic Data Commons (GDC) data dictionary
long_description = file: README.md
long_description_content_type = text/markdown
author = Gdc feature team
author_email = gdc_dev_questions-aaaaae2lhsbell56tlvh3upgoq@cdis.slack.com
maintainer = GDC Feature Team
maintainer_email = gdc_dev_questions-aaaaae2lhsbell56tlvh3upgoq@cdis.slack.com
license = Apache Software License 2.0
license_file = LICENSE
url = https://github.com/NCI-GDC/gdcdictionary
keywords = Genomic Data Commons, JSON schema, Data Dictionary, GDC, Cancer Research
classifiers =
    Programming Language :: PythonLicense :: OSI Approved :: Apache Software License
    Operating System :: Unix
    Operating System :: POSIX :: Linux
    Topic :: Software Development :: Libraries :: Python Modules
    Topic :: Internet
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11

[options]
zip_safe = True
packages = find:
package_dir =
    =src
python_requires = >=3.7
include_package_data = True
install_requires =
    PyYAML
    jsonschema
    attrs
    importlib_resources >= 1.3; python_version < '3.9'

[options.packages.find]
where = src

[options.package_data]
gdcdictionary =
    schemas/*.yaml
    schemas/projects/*.yaml

[options.extras_require]
dev =
    coverage[toml]
    pytest
    pytest-cov>=2.7.1,<2.12
lint =
    pre-commit
