$schema: "http://json-schema.org/draft-04/schema#"

id: "molecular_test"
title: Molecular Test
type: object
namespace: https://gdc.cancer.gov
category: clinical
project: '*'
program: '*'
description: >-
  Information pertaining to any molecular tests performed on the patient during a
  clinical event.
additionalProperties: false
submittable: true
downloadable: false
previous_version_downloadable: false
validators: null

systemProperties:
  - id
  - project_id
  - created_datetime
  - updated_datetime
  - state

links:
  - exclusive: false
    required: true
    subgroup:
      - name: follow_ups
        backref: molecular_tests
        label: performed_at
        target_type: follow_up
        multiplicity: many_to_one
        required: false
      - name: slides
        backref: molecular_tests
        label: related_to
        target_type: slide
        multiplicity: many_to_one
        required: false
      - name: diagnoses
        backref: molecular_tests
        label: related_to
        target_type: diagnosis
        multiplicity: many_to_one
        required: false

required:
  - submitter_id
  - gene_symbol
  - molecular_analysis_method
  - test_result

uniqueKeys:
  - [id]
  - [project_id, submitter_id]

