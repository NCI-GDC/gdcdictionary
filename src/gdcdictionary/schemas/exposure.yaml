$schema: "http://json-schema.org/draft-04/schema#"

id: "exposure"
title: Exposure
type: object
namespace: https://gdc.cancer.gov
category: clinical
project: '*'
program: '*'
description: >-
  Clinically relevant patient information not immediately resulting from genetic predispositions.
additionalProperties: false
submittable: true
downloadable: false
previous_version_downloadable: false
validators: null

systemProperties:
  - id
  - project_id
  - created_datetime
  - updated_datetime
  - state

links:
  - name: cases
    backref: exposures
    label: describes
    target_type: case
    multiplicity: many_to_one
    required: true

required:
  - submitter_id

uniqueKeys:
  - [id]
  - [project_id, submitter_id]

properties:

  $ref:
    - "_definitions.yaml#/ubiquitous_properties"

  age_at_last_exposure:
    $ref:
      - "_terms.yaml#/age_at_last_exposure/common"
    type: integer
    maximum: 89
    minimum: 0

  age_at_onset:
    $ref:
      - "_terms.yaml#/age_at_onset/common"
    type: integer
    maximum: 89
    minimum: 0

  alcohol_days_per_week:
    $ref:
      - "_terms.yaml#/alcohol_days_per_week/common"
    type: number
    maximum: 7
    minimum: 0

  alcohol_drinks_per_day:
    $ref:
      - "_terms.yaml#/alcohol_drinks_per_day/common"
    type: number
    minimum: 0

  alcohol_frequency:
    $ref:
      - "_terms.yaml#/alcohol_frequency/common"
    enum:
      - Daily Drinker
      - Weekly Drinker
      - Not Reported
      - Unknown

  alcohol_history:
    $ref:
      - "_terms.yaml#/alcohol_history/common"
    enum:
      - "Yes"
      - "No"
      - "yes"
      - "no"
      - Unknown
      - Not Reported
    deprecated_enum:
      - "no"
      - "yes"

  alcohol_intensity:
    $ref:
      - "_terms.yaml#/alcohol_intensity/common"
    enum:
